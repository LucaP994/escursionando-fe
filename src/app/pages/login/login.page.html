<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <img src="../../../assets/icon/favicon.png" alt="Escursionando" class="logo" />
      <h1>Escursionando</h1>
      <p class="subtitle">Condividi la tua passione per la montagna</p>
    </div>

    <div class="form-section">
      <ion-item>
        <ion-label position="floating">Username o Email</ion-label>
        <ion-input [(ngModel)]="username" type="text" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input [(ngModel)]="password" type="password" required></ion-input>
      </ion-item>

      <div class="error-message" *ngIf="error$ | async as error">
        <ion-text color="danger">{{ error }}</ion-text>
      </div>

      <ion-button expand="block" class="login-btn" (click)="login()" [disabled]="!username || !password">
        <ion-spinner *ngIf="loading$ | async"></ion-spinner>
        <span *ngIf="!(loading$ | async)">Accedi</span>
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/register">
        Non hai un account? Registrati
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="loginAsGuest()">
        Continua come ospite
      </ion-button>
    </div>
  </div>
</ion-content>
